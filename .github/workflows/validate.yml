# Build
# Validate
# Jeder PR
# Platform Linux
name: Build and validate
on: pull_request
jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Download prerequisites
        shell: pwsh
        run: .build/00prerequisites.ps1
      - name: Build modules for testing
        shell: pwsh
        run: .build/01builduniversal.ps1
    